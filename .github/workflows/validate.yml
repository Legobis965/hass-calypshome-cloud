name: Validation

on:
  push:
  pull_request:
  schedule:
    # Chaque lundi, pour détecter les changements de Home Assistant ou de HACS
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validation hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validation HACS
        uses: hacs/action@main
        with:
          category: integration
