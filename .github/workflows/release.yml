name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publier la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du manifest
        run: |
          manifest_version=$(jq -r .version custom_components/calypshome_cloud/manifest.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Le tag ($tag_version) ne correspond pas à la version du manifest ($manifest_version)"
            exit 1
          fi

      - name: Créer l'archive de l'intégration
        run: |
          cd custom_components/calypshome_cloud
          zip -r "$GITHUB_WORKSPACE/calypshome_cloud.zip" . -x '__pycache__/*' '*.pyc'

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: calypshome_cloud.zip
